name: Build and Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g. 1.0.0)'
        required: true

# NOTE: intentionally has no `concurrency` block. The other workflows cancel
# superseded PR runs, but a release must never be cancelled part-way: it
# publishes a tag, a GitHub release, APT/YUM/pacman packages, a Homebrew formula,
# a PKGBUILD on the AUR and a Nix bump. Interrupting it between those leaves
# exactly the inconsistent state the job ordering here exists to prevent -- and
# the AUR is somebody else's server, so that one cannot be undone by rewriting
# anything here.
permissions:
  contents: write
  pages: write

# Commit subjects marked as bookkeeping: automated commits that do not change
# the built code. `prepare` skips them when choosing what to tag, and `sync-nix`
# treats them as safe to commit the Nix version bump on top of. Both jobs must
# use the *same* pattern or they disagree about which commit is being released —
# which is exactly how #212 happened. Defined once here for that reason.
env:
  BOOKKEEPING_COMMIT_RE: '\[(skip ci|ci skip|no ci|skip actions|actions skip|benchmark)\]'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_canary: ${{ steps.resolve.outputs.is_canary }}
      package_name: ${{ steps.resolve.outputs.package_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 50  # Fetch enough history to find non-bookkeeping commits

      - name: Resolve commit and create tag
        id: resolve
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Releases have to come from a branch. The commit to tag is resolved
          # from `origin/<ref>`, which does not exist for a tag, and sync-nix
          # pushes the Nix version bump back to that same ref. Before the
          # commit-SHA input was removed this failed further down with a
          # misleading "could not find a non-bookkeeping commit"; say so plainly
          # and early instead.
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "::error::Releases must be dispatched from a branch, not a ${{ github.ref_type }}. Re-run this workflow from the branch you want to release."
            exit 1
          fi

          # Validate version format (no leading 'v', basic version like 1.2.3 or 1.2.3-beta.1)
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Expected format like '1.0' or '1.2.3' without 'v' prefix."
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # Detect canary release
          IS_CANARY=false
          PACKAGE_NAME="mkvdup"
          if [[ "$VERSION" == *-canary.* ]]; then
            IS_CANARY=true
            PACKAGE_NAME="mkvdup-canary"
          fi
          echo "is_canary=${IS_CANARY}" >> $GITHUB_OUTPUT
          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT

          # Check if tag already exists. Query the remote rather than the local
          # clone: checkout uses a shallow fetch, so a local rev-parse can miss
          # tags that do exist upstream.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin"
            exit 1
          fi

          # Determine which commit to tag: the latest bookkeeping-free commit on
          # the triggering branch. Everything newer than it is therefore
          # bookkeeping by construction, which is what lets sync-nix commit the
          # version bump on top of the branch head.
          BRANCH="${{ github.ref_name }}"
          echo "Finding latest non-bookkeeping commit on ${BRANCH}..."
          COMMIT=$(git log "origin/${BRANCH}" --oneline -50 | grep -v -iE "${BOOKKEEPING_COMMIT_RE}" | head -1 | awk '{print $1}')
          if [[ -z "${COMMIT}" ]]; then
            echo "::error::Could not find a non-bookkeeping commit in recent history"
            exit 1
          fi
          echo "Found non-bookkeeping commit: ${COMMIT}"

          # Resolve to full SHA
          FULL_SHA=$(git rev-parse "${COMMIT}")
          echo "commit=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "Resolved commit: ${FULL_SHA}"

          # Show what we're tagging
          echo "Will create tag ${TAG} on commit:"
          git log -1 --oneline "${FULL_SHA}"

      # NOTE: the tag is deliberately NOT created here. It is created by the
      # release job, at the resolved commit, only once every build has passed.
      # Pushing it up front meant a failed build left a dangling tag pointing at
      # a release that never happened, and blocked retrying the same version
      # because of the existence check above.

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pinned exactly, like nfpm/benchstat/staticcheck: an unpinned '1.26'
          # picks up new patch releases without warning, and a bare '>=' would
          # roll onto 1.27 the day it ships. Must stay >= 1.26.4 for nfpm
          # v2.47.0+.
          go-version: '1.26.5'  # keep in sync with the pinned nfpm version below

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.version }}" -o ${{ needs.prepare.outputs.package_name }} ./cmd/mkvdup

      - name: Expand man page variables
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: |
          UPPER=$(echo "$PACKAGE_NAME" | tr '[:lower:]' '[:upper:]')
          sed -i \
            -e "s/@PACKAGE_NAME_UPPER@/${UPPER}/g" \
            -e "s/@PACKAGE_NAME@/${PACKAGE_NAME}/g" \
            docs/mkvdup.1
          # Rename man page to match package name
          if [[ "$PACKAGE_NAME" != "mkvdup" ]]; then
            cp docs/mkvdup.1 "docs/${PACKAGE_NAME}.1"
          fi

      # Pinned deliberately. nfpm@latest previously broke releases by raising its
      # Go requirement out from under this workflow, which fails the build with
      # GOTOOLCHAIN=local -- hence an exact version, matching how benchstat and
      # staticcheck are pinned in the other workflows.
      #
      # v2.47.0 requires Go >= 1.26.4, satisfied by go-version 1.26.5 above.
      # Bump these two together, never independently: raising nfpm past what the
      # pinned Go supports breaks releases *and only releases*, so it would not
      # surface until a release was attempted.
      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build deb package
        if: matrix.goos == 'linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: |
          nfpm package --packager deb --target .

      - name: Build rpm package
        if: matrix.goos == 'linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: |
          nfpm package --packager rpm --target .

      # Consumed by the Homebrew formulae and by the Arch PKGBUILD.
      - name: Create release tarball
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TARBALL_NAME="${PACKAGE_NAME}_${GOOS}_${GOARCH}.tar.gz"

          # Create staging directory
          mkdir -p staging

          # Copy binary with correct name
          cp "${PACKAGE_NAME}" "staging/${PACKAGE_NAME}"

          # Copy man page with correct name
          if [[ "$PACKAGE_NAME" == "mkvdup" ]]; then
            cp docs/mkvdup.1 staging/mkvdup.1
          else
            cp "docs/${PACKAGE_NAME}.1" "staging/${PACKAGE_NAME}.1"
          fi

          # Copy documentation
          cp README.md DESIGN.md LICENSE staging/
          mkdir -p staging/docs
          cp docs/*.md staging/docs/

          # Copy shell completions
          cp scripts/mkvdup-completion.bash staging/
          cp scripts/mkvdup-completion.zsh staging/
          cp scripts/mkvdup.fish staging/

          # Mount helper for fstab/systemd integration. Kept under its own name --
          # it derives the binary to exec from the name it is installed under, and
          # the Arch package renames it at install time the way nfpm.yaml does.
          # Linux only, like the deb and rpm steps above: it drives util-linux's
          # mount helper protocol, which macOS has no equivalent of.
          if [[ "$GOOS" == "linux" ]]; then
            cp scripts/mount.fuse.mkvdup staging/
          fi

          # Create tarball
          tar -czvf "${TARBALL_NAME}" -C staging .

          echo "Created ${TARBALL_NAME}"
          ls -la "${TARBALL_NAME}"

      - name: List built packages
        run: |
          ls -la *.deb *.rpm *.tar.gz 2>/dev/null || true

      - name: Upload deb artifact
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-${{ matrix.goarch }}
          path: "*.deb"

      - name: Upload rpm artifact
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-${{ matrix.goarch }}
          path: "*.rpm"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  release:
    needs: [prepare, build, build-arch, sync-nix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages/
          merge-multiple: true

      - name: List packages
        run: ls -la packages/

      # This creates the tag as well as the release. target_commitish pins it to
      # the commit sync-nix produced — prepare's commit, plus the Nix version
      # bump when there was one — so the tag carries its own version. Without it
      # the tag would be created at the default branch head instead. Because this
      # job needs build, the tag only comes into existence after every build has
      # succeeded.
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.sync-nix.outputs.commit }}
          # Listed by extension rather than as packages/*: build-arch also publishes
          # the generated PKGBUILD and .SRCINFO as artifacts, for update-aur, and
          # those are not release assets.
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.tar.gz
            packages/*.pkg.tar.zst
          # Without this the action defaults to shrugging at a glob that matches
          # nothing, so an artifact that failed to land would publish a release
          # missing a whole package format -- and publish-pacman would then only
          # warn about it. build-arch runs before release precisely so an Arch
          # failure cannot half-publish a version; this closes the same gap on
          # the delivery side.
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_canary == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-mkvdup tap repo
        uses: actions/checkout@v7
        with:
          repository: stuckj/homebrew-mkvdup
          token: ${{ secrets.BENCHMARK_PAT || github.token }}

      - name: Download tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: tarballs/
          merge-multiple: true

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd tarballs

          PACKAGE_NAME="${{ needs.prepare.outputs.package_name }}"

          SHA_DARWIN_ARM64=$(sha256sum "${PACKAGE_NAME}_darwin_arm64.tar.gz" | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum "${PACKAGE_NAME}_darwin_amd64.tar.gz" | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum "${PACKAGE_NAME}_linux_arm64.tar.gz" | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum "${PACKAGE_NAME}_linux_amd64.tar.gz" | awk '{print $1}')

          echo "sha_darwin_arm64=${SHA_DARWIN_ARM64}" >> $GITHUB_OUTPUT
          echo "sha_darwin_amd64=${SHA_DARWIN_AMD64}" >> $GITHUB_OUTPUT
          echo "sha_linux_arm64=${SHA_LINUX_ARM64}" >> $GITHUB_OUTPUT
          echo "sha_linux_amd64=${SHA_LINUX_AMD64}" >> $GITHUB_OUTPUT

          echo "SHA256 checksums:"
          echo "  darwin_arm64: ${SHA_DARWIN_ARM64}"
          echo "  darwin_amd64: ${SHA_DARWIN_AMD64}"
          echo "  linux_arm64: ${SHA_LINUX_ARM64}"
          echo "  linux_amd64: ${SHA_LINUX_AMD64}"

      - name: Update stable Homebrew formula
        if: needs.prepare.outputs.is_canary == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.sha_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.sha_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.sha_linux_amd64 }}
        run: |
          cat > Formula/mkvdup.rb << 'FORMULA'
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for mkvdup (stable)
          # This file is auto-updated by the release workflow.
          # To install: brew tap stuckj/mkvdup && brew install mkvdup

          class Mkvdup < Formula
            desc "Storage deduplication tool for MKV files and their source media"
            homepage "https://github.com/stuckj/mkvdup"
            license "MIT"
          FORMULA

          cat >> Formula/mkvdup.rb << EOF
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end
          EOF

          cat >> Formula/mkvdup.rb << 'FORMULA'

            # Build from source when formula hasn't been updated yet
            head "https://github.com/stuckj/mkvdup.git", branch: "main"

            depends_on "go" => :build if build.head?

            def install
              if build.head?
                system "go", "build", *std_go_args(ldflags: "-s -w"), "./cmd/mkvdup"
                man1.install "docs/mkvdup.1"
                doc.install "README.md", "DESIGN.md", "LICENSE"
                doc.install Dir["docs/*.md"]
                bash_completion.install "scripts/mkvdup-completion.bash" => "mkvdup"
                zsh_completion.install "scripts/mkvdup-completion.zsh" => "_mkvdup"
                fish_completion.install "scripts/mkvdup.fish"
              else
                bin.install "mkvdup"
                man1.install "mkvdup.1"
                doc.install "README.md", "DESIGN.md", "LICENSE"
                doc.install Dir["docs/*"]
                bash_completion.install "mkvdup-completion.bash" => "mkvdup"
                zsh_completion.install "mkvdup-completion.zsh" => "_mkvdup"
                fish_completion.install "mkvdup.fish"
              end
            end

            test do
              if build.head?
                assert_match "mkvdup", shell_output("#{bin}/mkvdup --help")
              else
                assert_match version.to_s, shell_output("#{bin}/mkvdup --version")
              end
            end
          end
          FORMULA

      - name: Create versioned stable Homebrew formula
        if: needs.prepare.outputs.is_canary == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.sha_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.sha_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.sha_linux_amd64 }}
        run: |
          VERSIONED_FILE="Formula/mkvdup@${VERSION}.rb"

          # Never overwrite existing versioned formulae
          if [ -f "${VERSIONED_FILE}" ]; then
            echo "Versioned formula ${VERSIONED_FILE} already exists, skipping."
            exit 0
          fi

          # Derive Ruby class name following Homebrew's class_s convention
          # @ -> AT, dots/hyphens become word boundaries with CamelCase
          CLEAN_VERSION=$(echo "${VERSION}" | sed 's/[.\-]/ /g' | awk '{
            result=""
            for(i=1; i<=NF; i++) {
              seg = $i
              result = result toupper(substr(seg,1,1)) substr(seg,2)
            }
            print result
          }')
          CLASS_NAME="MkvdupAT${CLEAN_VERSION}"

          echo "Creating ${VERSIONED_FILE} with class ${CLASS_NAME}"

          cat > "${VERSIONED_FILE}" << HEADER
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for mkvdup@${VERSION} (pinned to v${VERSION})
          # This file is auto-generated by the release workflow.
          # To install: brew tap stuckj/mkvdup && brew install mkvdup@${VERSION}

          class ${CLASS_NAME} < Formula
            desc "Storage deduplication tool for MKV files and their source media"
            homepage "https://github.com/stuckj/mkvdup"
            license "MIT"
          HEADER

          cat >> "${VERSIONED_FILE}" << EOF
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end
          EOF

          cat >> "${VERSIONED_FILE}" << 'FORMULA'

            def install
              bin.install "mkvdup"
              man1.install "mkvdup.1"
              doc.install "README.md", "DESIGN.md", "LICENSE"
              doc.install Dir["docs/*"]
              bash_completion.install "mkvdup-completion.bash" => "mkvdup"
              zsh_completion.install "mkvdup-completion.zsh" => "_mkvdup"
              fish_completion.install "mkvdup.fish"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mkvdup --version")
            end
          end
          FORMULA

      - name: Update canary Homebrew formula
        if: needs.prepare.outputs.is_canary == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.sha_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.sha_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.sha_linux_amd64 }}
        run: |
          cat > Formula/mkvdup-canary.rb << 'FORMULA'
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for mkvdup-canary (pre-release)
          # This file is auto-updated by the release workflow.
          # To install: brew tap stuckj/mkvdup && brew install mkvdup-canary
          #
          # The canary version can be installed alongside the stable version.

          class MkvdupCanary < Formula
            desc "Storage deduplication tool for MKV files (canary/pre-release)"
            homepage "https://github.com/stuckj/mkvdup"
            license "MIT"
          FORMULA

          cat >> Formula/mkvdup-canary.rb << EOF
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end
          EOF

          cat >> Formula/mkvdup-canary.rb << 'FORMULA'

            # Build from source when formula hasn't been updated yet
            head "https://github.com/stuckj/mkvdup.git", branch: "main"

            depends_on "go" => :build if build.head?

            def install
              if build.head?
                system "go", "build", *std_go_args(output: bin/"mkvdup-canary", ldflags: "-s -w"), "./cmd/mkvdup"
                man1.install "docs/mkvdup.1" => "mkvdup-canary.1"
                doc.install "README.md", "DESIGN.md", "LICENSE"
                doc.install Dir["docs/*.md"]
                bash_completion.install "scripts/mkvdup-completion.bash" => "mkvdup-canary"
                zsh_completion.install "scripts/mkvdup-completion.zsh" => "_mkvdup-canary"
                fish_completion.install "scripts/mkvdup.fish" => "mkvdup-canary.fish"
              else
                bin.install "mkvdup-canary"
                man1.install "mkvdup-canary.1"
                doc.install "README.md", "DESIGN.md", "LICENSE"
                doc.install Dir["docs/*"]
                bash_completion.install "mkvdup-completion.bash" => "mkvdup-canary"
                zsh_completion.install "mkvdup-completion.zsh" => "_mkvdup-canary"
                fish_completion.install "mkvdup.fish" => "mkvdup-canary.fish"
              end
            end

            def caveats
              <<~EOS
                This is the canary (pre-release) version of mkvdup.
                The binary is installed as 'mkvdup-canary' to allow side-by-side
                installation with the stable 'mkvdup' package.
              EOS
            end

            test do
              if build.head?
                assert_match "mkvdup", shell_output("#{bin}/mkvdup-canary --help")
              else
                assert_match version.to_s, shell_output("#{bin}/mkvdup-canary --version")
              end
            end
          end
          FORMULA

      - name: Create versioned canary Homebrew formula
        if: needs.prepare.outputs.is_canary == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.sha_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.sha_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.sha_linux_amd64 }}
        run: |
          VERSIONED_FILE="Formula/mkvdup-canary@${VERSION}.rb"

          # Never overwrite existing versioned formulae
          if [ -f "${VERSIONED_FILE}" ]; then
            echo "Versioned formula ${VERSIONED_FILE} already exists, skipping."
            exit 0
          fi

          # Derive Ruby class name following Homebrew's class_s convention
          # @ -> AT, dots/hyphens become word boundaries with CamelCase
          CLEAN_VERSION=$(echo "${VERSION}" | sed 's/[.\-]/ /g' | awk '{
            result=""
            for(i=1; i<=NF; i++) {
              seg = $i
              result = result toupper(substr(seg,1,1)) substr(seg,2)
            }
            print result
          }')
          CLASS_NAME="MkvdupCanaryAT${CLEAN_VERSION}"

          echo "Creating ${VERSIONED_FILE} with class ${CLASS_NAME}"

          cat > "${VERSIONED_FILE}" << HEADER
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for mkvdup-canary@${VERSION} (pinned to v${VERSION})
          # This file is auto-generated by the release workflow.
          # To install: brew tap stuckj/mkvdup && brew install mkvdup-canary@${VERSION}
          #
          # The canary version can be installed alongside the stable version.

          class ${CLASS_NAME} < Formula
            desc "Storage deduplication tool for MKV files (canary/pre-release)"
            homepage "https://github.com/stuckj/mkvdup"
            license "MIT"
          HEADER

          cat >> "${VERSIONED_FILE}" << EOF
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/stuckj/mkvdup/releases/download/${TAG}/mkvdup-canary_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end
          EOF

          cat >> "${VERSIONED_FILE}" << 'FORMULA'

            def install
              bin.install "mkvdup-canary"
              man1.install "mkvdup-canary.1"
              doc.install "README.md", "DESIGN.md", "LICENSE"
              doc.install Dir["docs/*"]
              bash_completion.install "mkvdup-completion.bash" => "mkvdup-canary"
              zsh_completion.install "mkvdup-completion.zsh" => "_mkvdup-canary"
              fish_completion.install "mkvdup.fish" => "mkvdup-canary.fish"
            end

            def caveats
              <<~EOS
                This is the canary (pre-release) version of mkvdup.
                The binary is installed as 'mkvdup-canary' to allow side-by-side
                installation with the stable 'mkvdup' package.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mkvdup-canary --version")
            end
          end
          FORMULA

      - name: Commit and push formula update
        run: |
          # Validate that BENCHMARK_PAT was configured
          if [ "${{ secrets.BENCHMARK_PAT }}" = "" ]; then
            echo "WARNING: BENCHMARK_PAT secret not configured. Skipping formula update."
            exit 0
          fi
          git config user.name "stuckj"
          git config user.email "stuckj@users.noreply.github.com"
          git add Formula/
          git diff --staged --quiet || git commit -m "Update formula for ${{ needs.prepare.outputs.tag }}"
          git push

  # Builds the pacman packages and the PKGBUILD the AUR receives.
  #
  # Ordering: with the other builds, ahead of both sync-nix and release, so neither
  # the Nix bump nor the tag is pushed unless this has passed. An Arch failure after
  # the tag existed would leave the version tagged, released and live on Homebrew
  # while APT, YUM and pacman still served the previous one -- and unrepeatable,
  # because prepare refuses a version whose tag is already on the remote.
  #
  # The PKGBUILD points at release download URLs that consequently do not exist yet.
  # makepkg reuses a source file already present in the build directory instead of
  # fetching it, and still checks it against sha256sums, so the tarballs are seeded
  # from the build artifacts below. update-aur re-checks those URLs for real once the
  # release is up.
  build-arch:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Arch ships rolling tags only, so unlike go-version and nfpm above there is no
    # versioned image to pin.
    container: archlinux:base-devel
    steps:
      # The keyring is refreshed on its own first. A base image older than the
      # current signing keys cannot verify the packages in the upgrade that would
      # deliver its own replacement, and fails the whole transaction on an unknown
      # trust signature.
      - name: Install packaging tools
        run: |
          pacman -Sy --needed --noconfirm archlinux-keyring
          pacman -Su --needed --noconfirm git

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-linux-*
          path: tarballs/
          merge-multiple: true

      - name: Generate PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_CANARY: ${{ needs.prepare.outputs.is_canary }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: |
          # A pacman pkgver cannot contain a hyphen -- that is the pkgver/pkgrel
          # separator -- so 1.2.0-canary.1 becomes 1.2.0_canary.1. Canaries ship as
          # their own package here exactly as they do for deb and rpm, so this
          # version never has to sort against a stable one.
          PKGVER="${VERSION//-/_}"

          if [[ "$IS_CANARY" == "true" ]]; then
            PKGNAME="mkvdup-canary-bin"
            PKGDESC="Storage deduplication tool for MKV files (canary/pre-release)"
          else
            PKGNAME="mkvdup-bin"
            PKGDESC="Storage deduplication tool for MKV files and their source media"
          fi
          {
            echo "PKGNAME=${PKGNAME}"
            echo "PKGVER=${PKGVER}"
          } >> "$GITHUB_ENV"

          SHA_X86_64=$(sha256sum "tarballs/${PACKAGE_NAME}_linux_amd64.tar.gz" | awk '{print $1}')
          SHA_AARCH64=$(sha256sum "tarballs/${PACKAGE_NAME}_linux_arm64.tar.gz" | awk '{print $1}')

          mkdir -p pkgbuild
          sed -e "s|@PKGNAME@|${PKGNAME}|g" \
              -e "s|@BINNAME@|${PACKAGE_NAME}|g" \
              -e "s|@PKGVER@|${PKGVER}|g" \
              -e "s|@PKGDESC@|${PKGDESC}|g" \
              -e "s|@TAG@|${TAG}|g" \
              -e "s|@SHA256_X86_64@|${SHA_X86_64}|g" \
              -e "s|@SHA256_AARCH64@|${SHA_AARCH64}|g" \
              packaging/arch/PKGBUILD.in > pkgbuild/PKGBUILD

          # Both cases, not just upper: the rule the template documents is that no
          # at-delimited word survives, so a @commit@ someone adds without a
          # matching substitution above has to trip this too.
          if grep -n '@[A-Za-z0-9_]*@' pkgbuild/PKGBUILD; then
            echo "::error::PKGBUILD still contains unsubstituted placeholders"
            exit 1
          fi

          cat pkgbuild/PKGBUILD

      - name: Build packages
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: |
          # Seeded under the names the PKGBUILD's `::` renames give them, which is
          # what makes makepkg treat the sources as already downloaded. It still
          # verifies them against sha256sums, so a mismatch here is still caught.
          cp "tarballs/${PACKAGE_NAME}_linux_amd64.tar.gz" "pkgbuild/${PKGNAME}-${PKGVER}-x86_64.tar.gz"
          cp "tarballs/${PACKAGE_NAME}_linux_arm64.tar.gz" "pkgbuild/${PKGNAME}-${PKGVER}-aarch64.tar.gz"

          # makepkg refuses to run as root, which is what the container gives us.
          useradd --create-home builder
          chown -R builder:builder pkgbuild

          cd pkgbuild
          for target in x86_64 aarch64; do
            # CARCH is both what makepkg validates the arch=() array against and
            # what it records in .PKGINFO. Appending to a copy of the host config
            # overrides the runner's own x86_64 for the aarch64 pass. Nothing is
            # compiled, so CHOST is left alone, and the /etc/makepkg.conf.d
            # drop-ins the copy does not pull in only set compiler flags.
            #
            # Do not export CARCH or PACKAGER into this step instead:
            # load_makepkg_config restores both from the environment *after*
            # sourcing the config, so an exported value would silently win over
            # the per-architecture one written here.
            # PACKAGER is commented out in the stock config, and makepkg writes
            # "Unknown Packager" into .PKGINFO when it is unset -- which is what
            # pacman -Si would then show, unlike the maintainer nfpm.yaml gives
            # the deb and rpm.
            # Both values are quoted in the file: makepkg source_safe()s the
            # config and exits if it does not parse, and PACKAGER contains
            # spaces and angle brackets, which bash would read as a redirection.
            cp /etc/makepkg.conf "makepkg-${target}.conf"
            printf '\nCARCH=%q\nPACKAGER=%q\n' \
              "${target}" "stuckj <stuckj@users.noreply.github.com>" \
              >> "makepkg-${target}.conf"
            chown builder:builder "makepkg-${target}.conf"

            # --nodeps: fuse3 is a runtime dependency of the package being built,
            # and nothing in package() needs it present to assemble one.
            # --cleanbuild: the two passes share a directory, so the second would
            # otherwise extract over the first pass's leftovers.
            sudo -u builder makepkg --config "makepkg-${target}.conf" \
              --nodeps --noconfirm --cleanbuild
          done

          sudo -u builder bash -c 'makepkg --printsrcinfo > .SRCINFO'
          ls -la ./*.pkg.tar.zst .SRCINFO

      - name: Upload Arch package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: pkgbuild/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload PKGBUILD artifact
        uses: actions/upload-artifact@v7
        with:
          name: aur-pkgbuild
          path: |
            pkgbuild/PKGBUILD
            pkgbuild/.SRCINFO
          include-hidden-files: true

  # Publishes the same PKGBUILD to the AUR as mkvdup-bin / mkvdup-canary-bin. This
  # is the Arch analogue of update-homebrew: a recipe pushed to an external repo,
  # rather than packages served from gh-pages.
  update-aur:
    needs: [prepare, build-arch, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download PKGBUILD artifact
        uses: actions/download-artifact@v8
        with:
          name: aur-pkgbuild
          path: pkgbuild/

      # First, so that nothing below can turn a release red for a channel that is
      # not configured.
      - name: Check for AUR credentials
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY secret not configured. Skipping AUR publish."
            { echo "### ⚠️ AUR not updated"
              echo
              echo "\`AUR_SSH_PRIVATE_KEY\` is not configured, so this release did not reach the AUR."
              echo
              echo "Every other channel carries it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "AUR_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "AUR_ENABLED=true" >> "$GITHUB_ENV"
          fi

      # build-arch builds against seeded copies of the tarballs, so this is the
      # first and only point at which the URLs an AUR user will actually download
      # from are exercised. Deliberately here rather than earlier: a broken URL
      # should stop the AUR push, not a release that is otherwise complete.
      - name: Verify the release assets the PKGBUILD points at
        if: env.AUR_ENABLED == 'true'
        run: |
          # A PKGBUILD is a bash script of plain assignments plus package(), so the
          # URLs and sums can be read back out of the generated file rather than
          # reconstructed here and left to drift from it.
          # shellcheck disable=SC1091
          source pkgbuild/PKGBUILD

          verify() {
            local entry=$1 want=$2 url got
            url=${entry#*::}
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o asset.tar.gz "$url"
            got=$(sha256sum asset.tar.gz | awk '{print $1}')
            if [[ "$got" != "$want" ]]; then
              echo "::error::${url} hashes to ${got}, but the PKGBUILD claims ${want}"
              exit 1
            fi
            echo "OK ${url}"
          }

          verify "${source_x86_64[0]}" "${sha256sums_x86_64[0]}"
          verify "${source_aarch64[0]}" "${sha256sums_aarch64[0]}"

      - name: Push to the AUR
        if: env.AUR_ENABLED == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          # Published at https://aur.archlinux.org/ under "The following SSH
          # fingerprints are used for the AUR".
          AUR_ED25519_FINGERPRINT: 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
        run: |
          # Read back out of the generated PKGBUILD, like the sums above: the AUR
          # repository name has to equal the pkgbase being pushed, and aurweb
          # rejects the push if they disagree.
          # shellcheck disable=SC1091
          source pkgbuild/PKGBUILD
          PKGNAME=$pkgname

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # Scanned, then checked against the fingerprint aur.archlinux.org
          # publishes over HTTPS. A bare keyscan trusts whatever answers, and
          # exits 0 having written nothing when nothing does -- which surfaces
          # much later as "Host key verification failed" from the clone.
          ssh-keyscan -t ed25519 aur.archlinux.org > aur-hostkey
          scanned=$(ssh-keygen -lf aur-hostkey | awk '{print $2}')
          if [[ "$scanned" != "$AUR_ED25519_FINGERPRINT" ]]; then
            echo "::error::aur.archlinux.org presented ${scanned}, expected ${AUR_ED25519_FINGERPRINT}"
            exit 1
          fi
          cat aur-hostkey >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          # A package name the AUR has never seen clones as an empty repository;
          # pushing to it is what creates it.
          git clone "ssh://aur@aur.archlinux.org/${PKGNAME}.git" aur
          cp pkgbuild/PKGBUILD pkgbuild/.SRCINFO aur/

          cd aur
          git config user.name "stuckj"
          git config user.email "stuckj@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Update to ${VERSION}"
          # Explicit refspec: an empty clone has no upstream branch to infer one
          # from, and the AUR only accepts master.
          git push origin HEAD:refs/heads/master

  # Rebuilds the pacman repositories from the release assets.
  #
  # Unlike APT and YUM, this touches nothing on gh-pages. A pacman database can
  # only name a package by bare filename -- libalpm rejects a %FILENAME% with a
  # '/' in it -- so the packages have to sit in the same flat directory as the
  # database that lists them. A GitHub release is exactly that, which is why each
  # channel and architecture gets a release of its own to be the repository.
  #
  # Gated on release for the same reason publish-repo is: the packages this reads
  # are the ones the release job just attached.
  publish-pacman:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    # Shared with rebuild-pacman-repo.yml: both run the same script against the
    # same four releases, and its last step deletes every asset not in its own
    # build. A rebuild dispatched mid-release would enumerate before this job
    # attached the new packages and then delete them, leaving a signed database
    # naming a file that 404s.
    #
    # queue: max is load-bearing, not decoration. cancel-in-progress only spares
    # the job that is already running: by default a *pending* one is cancelled to
    # make room for the newcomer, which would silently drop a release's publish
    # while it waited behind a rebuild -- the part-way cancellation the top of
    # this file exists to prevent.
    concurrency:
      group: pacman-repositories
      cancel-in-progress: false
      queue: max
    # repo-add --include-sigs needs pacman 6.1; ubuntu-latest ships 6.0.2. Same
    # rolling-tag caveat as build-arch above.
    container: archlinux:base
    steps:
      - name: Install tools
        run: |
          pacman -Sy --needed --noconfirm archlinux-keyring
          pacman -Su --needed --noconfirm git github-cli

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # So the script can tell a release that reached this channel from one
          # the channel declined as older, and warn about the latter.
          RELEASED_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASED_CHANNEL: ${{ needs.prepare.outputs.is_canary == 'true' && 'canary' || 'stable' }}
        run: ./scripts/publish-pacman-repo.sh

  # Writes the release version, and a refreshed vendorHash, into the Nix files on
  # the ref being released, so the tag created below actually contains them.
  #
  # This is what makes `nix profile install github:stuckj/mkvdup/<tag>#mkvdup-canary`
  # report the version on the tin. The old update-nix job wrote the bump to main
  # instead of to the released ref, which got it wrong twice over: a canary tag
  # inherited whatever version its branch happened to carry, and main was left
  # claiming a version whose code was not on it.
  #
  # Ordering: after every build, so nothing is pushed until all of them have passed,
  # and before release, so the tag can be created at the resulting commit.
  sync-nix:
    needs: [prepare, build, build-arch]
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - name: Checkout the released ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.BENCHMARK_PAT || github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Sync Nix files onto the released commit
        id: sync
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Falls back to tagging exactly what prepare resolved.
          target="${COMMIT}"
          sync=true
          reason=""

          # The bump is committed on top of the branch head, and the tag is then
          # created at the result — so the head has to be something we are
          # willing to release. prepare picked the newest non-bookkeeping commit,
          # meaning anything after it *should* be bookkeeping only. The branch
          # can still move while `build` runs, though, so re-check here rather
          # than assume.
          #
          # Note prepare greps `git log --oneline` ("<sha> <subject>") while this
          # greps `--format=%s` (subject alone). A hex sha cannot match the
          # pattern, so the two are equivalent — this is not a bug to "fix".
          extra=""
          if [[ "${REF_TYPE}" != "branch" ]]; then
            # Unreachable in practice — prepare rejects a non-branch dispatch
            # before any job runs. Kept because the cost of being wrong here is a
            # bad push during a release, and the check is one comparison.
            reason="dispatched from a ${REF_TYPE}, not a branch — there is no branch to commit the bump to"
            sync=false
          elif ! git merge-base --is-ancestor "${COMMIT}" HEAD; then
            # Force-push while the release was running. Without this the range
            # check below would silently compare against unrelated history.
            reason="${COMMIT} is not an ancestor of ${BRANCH} — the branch was rewritten mid-release"
            sync=false
          else
            # `|| true` because grep exits 1 when it finds nothing, which is the
            # success case here: an empty range (HEAD is the released commit) or
            # bookkeeping-only commits on top of it.
            extra=$(git log --format=%s "${COMMIT}..HEAD" | grep -v -iE "${BOOKKEEPING_COMMIT_RE}" || true)
            if [[ -n "${extra}" ]]; then
              reason="${BRANCH} moved past ${COMMIT} during the release, with commits that are not bookkeeping"
              sync=false
            fi
          fi

          if [[ "${sync}" != true ]]; then
            # Deliberately a warning, not a notice: a notice on an otherwise
            # green release is invisible, which is how v1.9.0 shipped reporting
            # 1.8.2 (#212). Not a hard failure — standing down is the correct
            # outcome here, it just must not be silent.
            echo "::warning::Nix version bump skipped — ${TAG} will report the version already in flake.nix, not ${VERSION}. Reason: ${reason}"
            {
              echo "### ⚠️ Nix version bump skipped"
              echo
              echo "\`${TAG}\` will report the version currently in \`flake.nix\`, **not \`${VERSION}\`**."
              echo
              echo "Reason: ${reason}"
              if [[ -n "${extra}" ]]; then
                echo
                echo "Commits that are not bookkeeping:"
                echo
                echo '```'
                echo "${extra}"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${sync}" == true ]]; then
            sed -i "s/version = \".*\";/version = \"${VERSION}\";/" flake.nix
            sed -i "s/version = \".*\";/version = \"${VERSION}\";/" default.nix
            ./scripts/update-nix-vendor-hash.sh

            git add flake.nix default.nix flake.lock
            if git diff --staged --quiet; then
              echo "Nix files already current for ${TAG}"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "Update Nix files for ${TAG} [skip ci]"

              # Deliberately no rebase-and-retry here, unlike nix-canary-hash:
              # rebasing would move the bump onto commits that were never built,
              # and the tag points at whatever this produces. Fail instead.
              if ! git push origin "HEAD:${BRANCH}"; then
                echo "::error::${BRANCH} moved during the release; re-run once it has settled"
                exit 1
              fi
            fi

            # Tag the head, not prepare's commit. They differ whenever
            # bookkeeping commits sit on top, and it is the head that carries the
            # current Nix files — including the case where no bump was needed
            # because a vendorHash refresh had already landed there.
            target="$(git rev-parse HEAD)"
            echo "Nix files current for ${TAG} at ${target}"
            echo "Nix version set to \`${VERSION}\`, tagging \`${target}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "commit=${target}" >> "$GITHUB_OUTPUT"

  publish-repo:
    # Also gated on release: publishing APT/YUM packages for a version that has
    # no tag and no GitHub release would leave users able to install something
    # that does not officially exist.
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        id: checkout-gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: Initialize gh-pages if needed
        if: steps.checkout-gh-pages.outcome == 'failure'
        run: |
          mkdir -p gh-pages
          cd gh-pages
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b gh-pages

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> $GITHUB_ENV

          # Configure GPG for non-interactive use
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

      - name: Download all deb packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-package-*
          path: packages/
          merge-multiple: true

      - name: Download all rpm packages
        uses: actions/download-artifact@v8
        with:
          pattern: rpm-package-*
          path: packages/
          merge-multiple: true

      - name: Setup APT repository structure
        env:
          IS_CANARY: ${{ needs.prepare.outputs.is_canary }}
        run: |
          cd gh-pages

          # Set paths based on release channel
          if [[ "$IS_CANARY" == "true" ]]; then
            POOL="pool/canary"
            DIST="dists/canary"
            SUITE="canary"
            LABEL="mkvdup-canary"
            DESC="mkvdup canary packages"
          else
            POOL="pool/main"
            DIST="dists/stable"
            SUITE="stable"
            LABEL="mkvdup"
            DESC="mkvdup packages"
          fi

          # Create directory structure
          mkdir -p "apt/${POOL}"
          mkdir -p "apt/${DIST}/main/binary-amd64"
          mkdir -p "apt/${DIST}/main/binary-arm64"

          # Copy deb packages to pool
          cp ../packages/*.deb "apt/${POOL}/"

          # Generate Packages files for each architecture
          cd apt
          dpkg-scanpackages --arch amd64 "${POOL}/" > "${DIST}/main/binary-amd64/Packages"
          gzip -k -f "${DIST}/main/binary-amd64/Packages"
          dpkg-scanpackages --arch arm64 "${POOL}/" > "${DIST}/main/binary-arm64/Packages"
          gzip -k -f "${DIST}/main/binary-arm64/Packages"

          # Create Release file
          cd "${DIST}"
          cat > Release << EOF
          Origin: ${LABEL}
          Label: ${LABEL}
          Suite: ${SUITE}
          Codename: ${SUITE}
          Architectures: amd64 arm64
          Components: main
          Description: ${DESC}
          Date: $(date -Ru)
          EOF

          # Add checksums to Release file
          echo "SHA256:" >> Release
          for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz \
                   main/binary-arm64/Packages main/binary-arm64/Packages.gz; do
            if [[ -f "$f" ]]; then
              SIZE=$(stat -c%s "$f")
              SHA=$(sha256sum "$f" | awk '{print $1}')
              echo " $SHA $SIZE $f" >> Release
            fi
          done

          # Sign the Release file
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --armor --passphrase-fd 0 --detach-sign -o Release.gpg Release
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --armor --passphrase-fd 0 --clearsign -o InRelease Release

      - name: Setup YUM repository structure
        env:
          IS_CANARY: ${{ needs.prepare.outputs.is_canary }}
        run: |
          cd gh-pages

          # Set YUM directory based on release channel
          if [[ "$IS_CANARY" == "true" ]]; then
            YUM_DIR="yum-canary"
          else
            YUM_DIR="yum"
          fi

          # Create directory structure
          mkdir -p "${YUM_DIR}/packages"

          # Copy rpm packages
          cp ../packages/*.rpm "${YUM_DIR}/packages/"

          # Generate repository metadata
          cd "${YUM_DIR}"
          createrepo_c .

          # Sign the repository metadata
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --armor --passphrase-fd 0 --detach-sign -o repodata/repomd.xml.asc repodata/repomd.xml

      - name: Export GPG public key
        run: |
          cd gh-pages
          gpg --armor --export ${{ env.GPG_KEY_ID }} > gpg-key.asc
          # Copy to all repo directories that exist. The pacman channel is served
          # from release assets and has no directory here, but it does import this
          # key -- it is the same key for every channel.
          for dir in apt yum yum-canary; do
            if [[ -d "$dir" ]]; then cp gpg-key.asc "$dir/"; fi
          done

      - name: Create index page
        run: |
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>mkvdup - Package Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
              h2 { margin-top: 30px; }
            </style>
          </head>
          <body>
            <h1>mkvdup</h1>
            <p>MKV deduplication tool using FUSE. Store MKV files as small dedup files that reference original DVD/Blu-ray sources.</p>

            <h2>macOS / Linux (Homebrew)</h2>
            <pre>
          brew tap stuckj/mkvdup
          brew install mkvdup</pre>

            <h2>Debian/Ubuntu (APT)</h2>
            <pre>
          # Add the GPG key
          curl -fsSL https://stuckj.github.io/mkvdup/gpg-key.asc | sudo gpg --dearmor -o /usr/share/keyrings/mkvdup.gpg

          # Add the repository
          echo "deb [signed-by=/usr/share/keyrings/mkvdup.gpg arch=amd64,arm64] https://stuckj.github.io/mkvdup/apt stable main" | sudo tee /etc/apt/sources.list.d/mkvdup.list

          # Install
          sudo apt update
          sudo apt install mkvdup</pre>

            <h2>RHEL/CentOS/Fedora (YUM/DNF)</h2>
            <pre>
          # Add the repository
          sudo tee /etc/yum.repos.d/mkvdup.repo &lt;&lt; 'REPO'
          [mkvdup]
          name=mkvdup
          baseurl=https://stuckj.github.io/mkvdup/yum
          enabled=1
          gpgcheck=1
          gpgkey=https://stuckj.github.io/mkvdup/yum/gpg-key.asc
          REPO

          # Install
          sudo dnf install mkvdup</pre>

            <h2>Arch Linux (pacman)</h2>
            <pre>
          # Trust the signing key (the same key the APT and YUM repositories use)
          curl -fsSL https://stuckj.github.io/mkvdup/gpg-key.asc | sudo pacman-key --add -
          sudo pacman-key --lsign-key 3AABF4C834FFE7E08D91A9BACDB7B8F88AFCCBE3

          # Add the repository
          sudo tee -a /etc/pacman.conf &lt;&lt; 'REPO'

          [mkvdup]
          SigLevel = Required
          Server = https://github.com/stuckj/mkvdup/releases/download/pacman-$arch
          REPO

          # Install
          sudo pacman -Syu mkvdup-bin</pre>

            <p>Also on the AUR as
            <a href="https://aur.archlinux.org/packages/mkvdup-bin"><code>mkvdup-bin</code></a>,
            if you would rather not add a repository: <code>yay -S mkvdup-bin</code>.</p>

            <h2>Canary Channel (Pre-release)</h2>
            <p>The canary channel provides early access to new features. It installs as
            <code>mkvdup-canary</code> and can be installed alongside the stable version.</p>

            <h3>macOS / Linux (Homebrew) - Canary</h3>
            <pre>
          brew tap stuckj/mkvdup
          brew install mkvdup-canary</pre>

            <h3>Debian/Ubuntu (APT) - Canary</h3>
            <pre>
          # Add the GPG key (same key as stable)
          curl -fsSL https://stuckj.github.io/mkvdup/gpg-key.asc | sudo gpg --dearmor -o /usr/share/keyrings/mkvdup.gpg

          # Add the canary repository
          echo "deb [signed-by=/usr/share/keyrings/mkvdup.gpg arch=amd64,arm64] https://stuckj.github.io/mkvdup/apt canary main" | sudo tee /etc/apt/sources.list.d/mkvdup-canary.list

          # Install
          sudo apt update
          sudo apt install mkvdup-canary</pre>

            <h3>RHEL/CentOS/Fedora (YUM/DNF) - Canary</h3>
            <pre>
          # Add the canary repository
          sudo tee /etc/yum.repos.d/mkvdup-canary.repo &lt;&lt; 'REPO'
          [mkvdup-canary]
          name=mkvdup-canary
          baseurl=https://stuckj.github.io/mkvdup/yum-canary
          enabled=1
          gpgcheck=1
          gpgkey=https://stuckj.github.io/mkvdup/yum-canary/gpg-key.asc
          REPO

          # Install
          sudo dnf install mkvdup-canary</pre>

            <h3>Arch Linux (pacman) - Canary</h3>
            <pre>
          # Trust the signing key (same key as stable)
          curl -fsSL https://stuckj.github.io/mkvdup/gpg-key.asc | sudo pacman-key --add -
          sudo pacman-key --lsign-key 3AABF4C834FFE7E08D91A9BACDB7B8F88AFCCBE3

          # Add the canary repository
          sudo tee -a /etc/pacman.conf &lt;&lt; 'REPO'

          [mkvdup-canary]
          SigLevel = Required
          Server = https://github.com/stuckj/mkvdup/releases/download/pacman-canary-$arch
          REPO

          # Install
          sudo pacman -Syu mkvdup-canary-bin</pre>

            <h2>Links</h2>
            <ul>
              <li><a href="https://github.com/stuckj/mkvdup">GitHub Repository</a></li>
              <li><a href="https://github.com/stuckj/mkvdup/releases">Release Downloads</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update packages for ${{ needs.prepare.outputs.tag }}"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
